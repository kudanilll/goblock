[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/world",
    "crates/render",
    "crates/input",
    "crates/app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Achmad Daniel Syahputra"]

[workspace.dependencies]
glam = "0.30"
ash = "0.38"
ash-window = "0.13"
bytemuck = { version = "1", features = ["derive"] }
winit = "0.30"
raw-window-handle = "0.6"
fastnoise-lite = "1.1.1"
png = "0.17.16"

goblock-core = { path = "crates/core" }
goblock-world = { path = "crates/world" }
goblock-render = { path = "crates/render" }
goblock-input = { path = "crates/input" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Terrain generation and meshing run constantly while the player moves, and
# are too slow to stream chunks at opt-level 1.
[profile.dev.package.goblock-world]
opt-level = 3

[profile.release]
lto = "thin"
