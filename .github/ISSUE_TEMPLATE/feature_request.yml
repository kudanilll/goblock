name: Feature request
description: Suggest an enhancement, gameplay mechanic, or technical improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Feature proposals should align with GoBlock's core design: a block-world game running on Vulkan 1.0 with strict crate separation.

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: What problem does this solve or what experience does it add?
      placeholder: Describe why this change is useful.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should the feature work?
      placeholder: Describe the desired behavior or API design.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or solutions you looked at.

  - type: textarea
    id: architecture-impact
    attributes:
      label: Architecture impact
      description: Note which crates, rendering passes, shaders, or save formats this change would touch.
      placeholder: Touches world meshing, Frame uniform block, etc.

  - type: checkboxes
    id: checklists
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues and discussions for similar suggestions.
          required: true
